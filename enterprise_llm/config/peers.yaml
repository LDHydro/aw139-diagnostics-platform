# Registry of other internal LLM/AI systems this platform may consult.
#
# Credentials are NEVER stored here. `auth_env_var` names an environment
# variable that the gateway reads at call time; put the actual secret in the
# systemd unit's EnvironmentFile or the container's secret store.
#
# `capabilities` are topic tags. A question whose wording overlaps a peer's
# tags routes to that peer automatically; when tags are inconclusive the
# local model picks. `allowed_groups` restricts which Active Directory
# groups may trigger a call at all - useful when a peer system holds data
# that not everyone here is cleared to see.
#
# Entries added through POST /v1/peers (stored in the database) override
# entries with the same name here, so you can register a system without a
# redeploy.

peers: []

