[project]
name = "enterprise-llm-platform"
version = "1.0.0"
description = "Self-hosted LLM platform for aviation maintenance: cited document Q&A, AI federation, predictive maintenance scheduling, LaTeX and code assistance, governed by Active Directory groups."
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",

    # Persistence
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",

    # Identity
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",

    # Documents
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "pyyaml>=6.0.2",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
# Direct Active Directory bind, for sites with no OIDC provider.
ldap = ["ldap3>=2.9.1"]
# Reading .xlsx maintenance schedules directly.
excel = ["openpyxl>=3.1.5"]
# NAMIS is Microsoft SQL Server. Also needs the Microsoft ODBC Driver 18
# and unixODBC installed on the host - they are not pip-installable.
mssql = ["aioodbc>=0.5.0", "pyodbc>=5.1.0"]
# Model serving. Installed separately by deploy/install_host.sh because the
# PyTorch build must come from the CUDA 12.8 index for Blackwell.
serving = ["vllm>=0.9.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # FastAPI's dependency injection is expressed as a call in the default
    # argument (`Depends(...)`, `File(...)`, `Form(...)`). That is the
    # framework's documented API, not a mutable-default bug.
    "B008",
    # `class X(str, Enum)` is kept over `StrEnum` because SQLAlchemy and
    # Pydantic both round-trip the `.value` of these consistently, and the
    # enums are persisted in the database.
    "UP042",
]
