# Optional: regenerate AW139Diagnostics.xcodeproj with XcodeGen.
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# The committed .xcodeproj already works; this is a reliable fallback if you
# prefer to regenerate it or the project file gets out of sync.

name: AW139Diagnostics
options:
  bundleIdPrefix: com.aw139
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    branch: main

targets:
  AW139 Diagnostics:
    type: application
    platform: iOS
    sources:
      - path: AW139Diagnostics
    info:
      path: AW139Diagnostics/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aw139.diagnostics
        TARGETED_DEVICE_FAMILY: "2"   # iPad only
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: MLXSwiftExamples
        product: MLXEmbedders
