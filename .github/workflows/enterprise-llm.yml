# Tests and lint for the Enterprise LLM Platform.
#
# The suite deliberately needs no database, no GPU and no model server: the
# forecasting, planning, chunking, SQL-guard and compiler logic are pure
# functions over plain dataclasses precisely so they can be checked here.
# Anything that does need infrastructure is exercised by
# enterprise_llm/scripts/smoke_test.py against a real deployment instead.

name: enterprise-llm

on:
  push:
    branches: ["**"]
    paths:
      - "enterprise_llm/**"
      - ".github/workflows/enterprise-llm.yml"
  pull_request:
    paths:
      - "enterprise_llm/**"
      - ".github/workflows/enterprise-llm.yml"

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: enterprise-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >=3.11. Both are tested because the code uses
        # 3.11-era syntax (datetime.UTC, X | None at runtime) that fails
        # loudly on older interpreters and quietly on none.
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: enterprise_llm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: enterprise_llm/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # dev brings pytest and ruff; excel brings openpyxl for the
          # spreadsheet export tests. vLLM and the ODBC driver are not
          # installed: nothing here talks to a model or a database.
          pip install -e ".[dev,excel]"

      - name: Lint
        run: ruff check elp scripts tests

      - name: Test
        run: pytest tests -q

      - name: Check the app assembles
        # Catches a broken import or a route collision that the unit tests
        # would not, since most of them never build the app.
        env:
          ELP_ENVIRONMENT: development
          ELP_AUTH__MODE: disabled
        run: |
          python -c "
          from elp.main import create_app
          paths = create_app().openapi()['paths']
          print(f'{len(paths)} endpoints registered')
          assert len(paths) > 50, 'routes went missing'
          "
